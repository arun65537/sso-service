server:
  port: 8090

spring:
  datasource:
    hikari:
      max-lifetime: 1800000
      connection-timeout: 20000
      validation-timeout: 5000
    url: jdbc:postgresql://localhost:5432/sso_db
    username: postgres
    password: postgres
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 1
  data:
    redis:
      repositories:
        enabled: false
      host: localhost
      port: 6379
      username: default
      password: ""
      timeout: 2s
  cache:
    type: redis
  kafka:
    bootstrap-servers: localhost:9092
    properties:
      security:
        protocol: SSL
      ssl:
        truststore:
          type: PEM
          location: ${user.dir}/src/main/resources/ca.pem
        keystore:
          type: PKCS12
          location: ${user.dir}/src/main/resources/client.keystore.p12
          password: changeit

app:
  jwt:
    private-key-base64: 
    public-key-base64: 
  verification:
    base-url: http://localhost:8090
  password-reset:
    base-url: http://localhost:8090

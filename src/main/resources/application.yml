spring:
  profiles:
    default: local
  application:
    name: sso-service
  jpa:
    open-in-view: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

app:
  jwt:
    issuer: ordernest-sso
    access-token-minutes: 15
    refresh-token-days: 7
    key-id: sso-key-1
  security:
    login-rate-limit-count: 5
    login-rate-limit-window-seconds: 60
  verification:
    token-minutes: 30
    path: /verify-email
  password-reset:
    token-minutes: 30
    path: /change-password
  kafka:
    topic:
      sso-action-events: sso.action.event

logging:
  level:
    root: INFO
    com.ordernest.sso: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} %-5level [%thread] %logger{36} - %msg%n"
